name: Smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: npm install --ignore-scripts

      - name: Smoke test
        run: npm run smoke

      - name: Pack dry run
        run: npm pack --dry-run
